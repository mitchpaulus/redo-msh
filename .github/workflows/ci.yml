name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Installs `msh`/`mshell` on PATH (Linux + Windows) and sets up the
      # versioned std.msh/init.msh so do-files run. The do-files in tests/ use
      # only mshell built-ins, so the end-to-end suite runs identically on both.
      #
      # Pin BOTH the action ref and the installed mshell version: mshell makes
      # breaking language changes between releases, and the action's `version`
      # input defaults to `latest`, so an unpinned setup silently adopts each new
      # release and can break the suite without any change here. Bump these two in
      # lockstep (and verify the do-files still build) when moving to a new mshell.
      - name: Install mshell
        uses: mitchpaulus/mshell@v0.13.0
        with:
          version: v0.13.0

      - name: Show tool versions
        shell: bash
        run: |
          rustc --version
          cargo --version
          msh --version

      - name: Build
        run: cargo build --verbose --locked

      - name: Test (unit + end-to-end)
        run: cargo test --verbose --locked
