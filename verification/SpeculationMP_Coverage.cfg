\* Coverage check, EXPECTED VIOLATION of NeverVerifiedOverRebuild: on the
\* chain, a dep rebuilt with identical content lets its parent verify
\* (content-hash pruning), so the model genuinely distinguishes "rebuilt"
\* from "changed" and VerifiedSoundly's dep clause is not vacuous.
SPECIFICATION Spec
CONSTANTS
    Targets <- ChainTargets
    Recorded <- ChainDeps
    Actual <- ChainDeps
    Roots <- RootsA
    Cleanable <- ChainTargets
    BuildsCanFail = FALSE
    HandEdited <- NoTargets
    PromptAnswers <- Yes
INVARIANTS
    NeverVerifiedOverRebuild
