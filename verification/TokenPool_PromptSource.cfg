\* Fix 2 for PromptDeadlock, keeping the parallelism: a prompting job gives
\* its token back to where it came from (own -> its process's own slot,
\* waking that scheduler; pool -> pool) and resumes on its process's own
\* token if free, else a pool token. Depth 3.
SPECIFICATION Spec
CONSTANTS
    J = 2
    Lazy = TRUE
    Prompts = TRUE
    PromptMode = "source"
CONSTANT FanOut <- Tree122
INVARIANTS TypeOK TokenConservation OwnConsistent OwnUnique TokenHeld ChildrenOnlyWhileWaiting Bound ExactBound SemaphoreMax
PROPERTIES Termination
