\* THE PROPOSED RULES, two sessions, crashes anywhere: every property,
\* GC completeness and termination included.
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = TRUE
    SessionScopedLogs = TRUE
    GcAtomic = TRUE
    InodeCheck = TRUE
    JanitorDeletes = TRUE
    MaxCrashes = 2
CONSTANT Sessions <- TwoSessions
CONSTANT Builders <- TwoSessions
INVARIANTS TypeOK NoLostOutput NoGcFailedBuild NoLostEvent NoFalseCrash NoLostLog FollowsOwnBuild CleanExit JanitorCleans
PROPERTIES Termination
