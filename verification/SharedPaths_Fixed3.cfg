\* THE PROPOSED RULES, three sessions (the run-lock race needs three): two
\* builders plus a run with nothing to build that only sweeps. Checks
\* every invariant, GC completeness included, with at most one crash and
\* symmetry reduction over the interchangeable builders. (Termination is
\* checked without symmetry in SharedPaths_Fixed: TLC liveness checking is
\* unsound under symmetry.)
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = TRUE
    SessionScopedLogs = TRUE
    GcAtomic = TRUE
    InodeCheck = TRUE
    JanitorDeletes = TRUE
    MaxCrashes = 1
CONSTANT Sessions = {s1, s2, s3}
CONSTANT Builders = {s1, s2}
SYMMETRY Perms
INVARIANTS TypeOK NoLostOutput NoGcFailedBuild NoLostEvent NoFalseCrash NoLostLog FollowsOwnBuild CleanExit JanitorCleans
