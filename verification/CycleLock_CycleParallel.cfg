\* TWO workers (one session; the deadlock is the same across sessions)
\* entering the cycle a <-> b from different sides.
\* EXPECTED TO DEADLOCK (the gap): per-traversal chains cannot see a cycle
\* entered concurrently from two points, and the blocking locks close it.
\* run.sh treats TLC's "Deadlock reached" as the predicted outcome.
SPECIFICATION Spec
CONSTANT Targets <- CycleTargets
CONSTANT DepsOf <- CycleDeps
CONSTANT Workers <- TwoWorkers
CONSTANT StartOf <- StartAB
CONSTANT SessionOf <- SameSession
CONSTANT RecheckFresh = FALSE
INVARIANTS TypeOK BuildOnce LockOwnedByBusy
