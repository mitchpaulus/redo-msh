\* EXPECTED VIOLATION of NoLostEvent: an atomic GC alone is not enough.
\* Between File::create and lock_exclusive a GC can still unlink the fresh
\* lock file; without re-checking that the path names the locked file, the
\* run proceeds holding a lock on nothing. InodeCheck is required too.
\* (Two builders plus a third run that only sweeps; symmetry over builders.)
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = TRUE
    SessionScopedLogs = TRUE
    GcAtomic = TRUE
    InodeCheck = FALSE
    JanitorDeletes = TRUE
    MaxCrashes = 1
CONSTANT Sessions = {s1, s2, s3}
CONSTANT Builders = {s1, s2}
SYMMETRY Perms
INVARIANTS NoLostEvent
