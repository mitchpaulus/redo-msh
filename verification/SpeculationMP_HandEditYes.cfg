\* Demanded hand-edited targets (c is a recorded AND actual dep of a, d is
\* discovered mid-build), user answers yes: prompts happen only on demanded
\* lineages and the root settles done.
SPECIFICATION Spec
CONSTANTS
    Targets <- StaleTargets
    Recorded <- StaleRecorded
    Actual <- StaleActual
    Roots <- RootsA
    Cleanable <- StaleTargets
    BuildsCanFail = FALSE
    HandEdited <- HandCD
    PromptAnswers <- Yes
INVARIANTS
    TypeOK
    NoFailure
    ActualDepsFirst
    CommitOnce
    LockConsistent
    PromptOnlyDemanded
PROPERTIES
    EventuallyQuiescent
    AllRootsDone
