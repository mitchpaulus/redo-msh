\* Today's code with redo-always, two sessions plus a forced build: rebuilt
\* every session (never "redundant"); the within-session properties hold.
SPECIFICATION Spec
CONSTANTS
    MaxSrcEdits = 0
    CoarseTicks = FALSE
    MaxTicks = 0
    ExactDoFile = TRUE
    Phony = FALSE
    Always = TRUE
    RecheckOod = FALSE
    HashBeforeRename = FALSE
    RacyGitRule = FALSE
CONSTANT Procs <- ThreeProcs
CONSTANT SessionOf <- TwoSessions3
CONSTANT Forced <- P3Forced
INVARIANTS TypeOK Mutex LockHeld MarkerDiscipline NoRedundantBuild DiskDbAgree UpToDateIsTrue
PROPERTIES Termination
