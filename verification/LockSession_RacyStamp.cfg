\* KNOWN GAP, EXPECTED VIOLATION of UpToDateIsTrue: current_csum trusts a
\* cached source hash whenever mtime and size match. A source rewritten
\* within the timestamp tick in which redo hashed it keeps its mtime; the
\* change is never seen and the target stays "up to date" over stale input
\* (git's "racy git" problem). Reproduced against the binary.
SPECIFICATION Spec
CONSTANTS
    MaxSrcEdits = 2
    CoarseTicks = TRUE
    MaxTicks = 1
    ExactDoFile = TRUE
    Phony = FALSE
    Always = FALSE
    RecheckOod = FALSE
    HashBeforeRename = FALSE
    RacyGitRule = FALSE
CONSTANT Procs <- OneProc
CONSTANT SessionOf <- OneSession1
CONSTANT Forced <- NoneForced
INVARIANTS UpToDateIsTrue
