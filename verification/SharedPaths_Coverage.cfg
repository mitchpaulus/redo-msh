\* Coverage check, EXPECTED VIOLATION of JanitorCleans: a GC that never
\* deletes anything leaves files behind, so the passing JanitorCleans (GC
\* completeness) is not vacuous.
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = TRUE
    SessionScopedLogs = TRUE
    GcAtomic = TRUE
    InodeCheck = TRUE
    JanitorDeletes = FALSE
    MaxCrashes = 2
CONSTANT Sessions <- TwoSessions
CONSTANT Builders <- TwoSessions
INVARIANTS JanitorCleans
