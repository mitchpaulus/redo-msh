\* KNOWN GAP, EXPECTED VIOLATION of NoStaleRun: main's is_ood_shallow (re-check
\* recorded edges against disk, nothing more) with main's in-order checker.
\* Run B builds T over D; d.src is edited; run A starts, sees B's build in
\* flight, waits, and skips T on the shallow match without ever checking D.
\* A ends 'up to date' with T built from a stale D. Reproduced against the
\* real binary (main and the merge without its condition: 2 of 2 each).
SPECIFICATION Spec
CONSTANT Targets <- PairTargets
CONSTANT Sources <- PairSources
CONSTANT DepsOf <- PairDeps
CONSTANT Sessions <- TwoSessions
CONSTANT Root = "T"
CONSTANT MaxEdits = 2
CONSTANT Recheck = "shallow"
CONSTANT SpawnFirst = FALSE
INVARIANTS TypeOK NoStaleRun
