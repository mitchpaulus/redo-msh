\* KNOWN GAP of the "source" alternative, EXPECTED DEADLOCK: a prompter
\* that gives its token back lets another job take it, and that job then
\* blocks on the prompter's kernel lock holding it; once every token is
\* held that way, the answered prompter can never resume. Eager scheduler,
\* prompts at every depth, depth 2, J=2. (TokenPool_PromptSource passes
\* only because it has no lock waiters.)
SPECIFICATION Spec
CONSTANTS
    J = 2
    Lazy = FALSE
    Prompts = TRUE
    PromptMode = "source"
    LockWaits = TRUE
CONSTANT FanOut <- Tree22
INVARIANTS TypeOK TokenConservation OwnConsistent OwnUnique TokenHeld ChildrenOnlyWhileWaiting Bound ExactBound SemaphoreMax WorkConserving
PROPERTIES Termination
