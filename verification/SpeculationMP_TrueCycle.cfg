\* A genuinely cyclic project (a <-> b via the do-files) with an empty
\* database: cycle detection must work purely at discovery time, and every
\* interleaving must end with both roots reporting the error — never a
\* deadlock, never a silent success.
SPECIFICATION Spec
CONSTANTS
    Targets <- TwoTargets
    Recorded <- NoRecorded2
    Actual <- CycleActual
    Roots <- RootsAB
    Cleanable <- NoTargets
    BuildsCanFail = FALSE
    HandEdited <- NoTargets
    PromptAnswers <- Yes
INVARIANTS
    TypeOK
    CommitOnce
    LockConsistent
    PromptOnlyDemanded
PROPERTIES
    EventuallyQuiescent
    AllRootsFail
