\* Content soundness: recorded = actual chain a -> b -> c, every subset of
\* clean targets, rebuilds with changed or identical content, do-files that
\* may fail. A target verifies only over deps that settled ok with unchanged
\* content (VerifiedSoundly); failures are reported, never hung.
SPECIFICATION Spec
CONSTANTS
    Targets <- ChainTargets
    Recorded <- ChainDeps
    Actual <- ChainDeps
    Roots <- RootsA
    Cleanable <- ChainTargets
    BuildsCanFail = TRUE
    HandEdited <- NoTargets
    PromptAnswers <- Yes
INVARIANTS
    TypeOK
    ActualDepsFirst
    CommitOnce
    LockConsistent
    DemandEdgesPresent
    VerifiedSoundly
    PromptOnlyDemanded
PROPERTIES
    EventuallyQuiescent
