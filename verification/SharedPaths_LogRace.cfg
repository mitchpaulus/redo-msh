\* KNOWN GAP, EXPECTED VIOLATION of NoFalseCrash (capture/temp GC fixed so
\* they cannot mask it): one log path per target. A lagging follower
\* deletes its finished log BY PATH after the next run replaced it; that
\* run's `done` is lost and its follower reports "(crashed)". Reproduced.
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = TRUE
    SessionScopedLogs = FALSE
    GcAtomic = FALSE
    InodeCheck = FALSE
    JanitorDeletes = TRUE
    MaxCrashes = 2
CONSTANT Sessions <- TwoSessions
CONSTANT Builders <- TwoSessions
INVARIANTS NoFalseCrash
