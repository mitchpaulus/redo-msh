\* KNOWN GAP, EXPECTED VIOLATION of NoLostLog: a run's own target log
\* vanishes before its follower opens it -- swept by another run's startup
\* GC (the target lock is free once the build finishes) or deleted by path
\* by a lagging follower. Display-only ("(log missing)").
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = TRUE
    SessionScopedLogs = FALSE
    GcAtomic = FALSE
    InodeCheck = FALSE
    JanitorDeletes = TRUE
    MaxCrashes = 2
CONSTANT Sessions <- TwoSessions
CONSTANT Builders <- TwoSessions
INVARIANTS NoLostLog
