\* Two LIVE sessions whose do-files disagree (a -> b vs b -> a), racing:
\* when they would deadlock on each other's locks the cycle is reported
\* (a real one, through live edges); otherwise both finish. Never a hang.
SPECIFICATION Spec
CONSTANTS
    MaxCrashes = 0
    GcByLiveness = TRUE
CONSTANT Sessions <- TwoSessions
CONSTANT Targets <- AB
CONSTANT DepsOf <- ChangedGraphs
CONSTANT RootsOf <- RootsAB2
INVARIANTS TypeOK NoFalseCycle
PROPERTIES Termination
