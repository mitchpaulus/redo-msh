\* A demanded instance inside a SPECULATIVE lineage: stale a -> b builds b
\* speculatively, b's do-file demands hand-edited x. a no longer needs b,
\* so x must never be asked about: the lineage aborts, a rebuilds via c.
SPECIFICATION Spec
CONSTANTS
    Targets <- LinTargets
    Recorded <- LinRecorded
    Actual <- LinDropActual
    Roots <- RootsA
    Cleanable <- NoTargets
    BuildsCanFail = FALSE
    HandEdited <- HandX
    PromptAnswers <- YesNo
INVARIANTS
    TypeOK
    NoFailure
    ActualDepsFirst
    CommitOnce
    LockConsistent
    PromptOnlyDemanded
    NeverPrompted
PROPERTIES
    EventuallyQuiescent
    AllRootsDone
