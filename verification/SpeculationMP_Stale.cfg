\* Speculation.tla's stale-database instance, replayed on the multi-process
\* machine: recorded says a needs {b,c}; the do-file now declares {c,d}.
\* Acyclic reality: no failure may appear and the root must settle done.
SPECIFICATION Spec
CONSTANTS
    Targets <- StaleTargets
    Recorded <- StaleRecorded
    Actual <- StaleActual
    Roots <- RootsA
    Cleanable <- StaleTargets
    BuildsCanFail = FALSE
    HandEdited <- NoTargets
    PromptAnswers <- Yes
INVARIANTS
    TypeOK
    NoFailure
    ActualDepsFirst
    CommitOnce
    LockConsistent
    PromptOnlyDemanded
PROPERTIES
    EventuallyQuiescent
    AllRootsDone
