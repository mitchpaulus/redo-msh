\* The reproduced implementation deadlock, as a model instance: stale
\* recorded deps cross two parallel branches (d1 recorded-depends on t2,
\* d2 on t1) while the real graph is acyclic (t1 -> d1, t2 -> d2). The
\* shipping branch hangs here 10/10; the corrected machine must settle
\* every instance with no failure anywhere.
SPECIFICATION Spec
CONSTANTS
    Targets <- CrossTargets
    Recorded <- CrossRecorded
    Actual <- CrossActual
    Roots <- RootsT1T2
    Cleanable <- NoTargets
    BuildsCanFail = FALSE
    HandEdited <- NoTargets
    PromptAnswers <- Yes
INVARIANTS
    TypeOK
    NoFailure
    ActualDepsFirst
    CommitOnce
    LockConsistent
    PromptOnlyDemanded
PROPERTIES
    EventuallyQuiescent
    AllRootsDone
