\* KNOWN GAP (former code), EXPECTED DEADLOCK: prompt_overwrite before
\* 2026-09-03 released a token to the POOL and spun on pool try-acquire.
\* One process, three jobs, no nesting at all (so not
\* TokenPool_PromptDeadlock's mechanism), J=2: the released token and the
\* other pool token are taken by jobs that then block on the prompter's
\* kernel lock; the answered prompter spins forever. (Formerly
\* TokenPoolPromptLock.tla in release mode.)
SPECIFICATION Spec
CONSTANTS
    J = 2
    Lazy = FALSE
    Prompts = TRUE
    PromptMode = "pool"
    LockWaits = TRUE
CONSTANT FanOut <- Tree3
INVARIANTS TypeOK TokenConservation OwnConsistent OwnUnique TokenHeld ChildrenOnlyWhileWaiting Bound ExactBound SemaphoreMax WorkConserving
PROPERTIES Termination
