\* R6 on the mid-build-abort shape with s hand-edited: s is only ever built
\* speculatively (nobody's do-file demands it), so the user must never be
\* asked about it; s yields sfail and t commits.
SPECIFICATION Spec
CONSTANTS
    Targets <- AbortTargets
    Recorded <- AbortRecorded
    Actual <- AbortActual
    Roots <- RootsT
    Cleanable <- NoTargets
    BuildsCanFail = FALSE
    HandEdited <- HandS
    PromptAnswers <- YesNo
INVARIANTS
    TypeOK
    NoFailure
    ActualDepsFirst
    CommitOnce
    LockConsistent
    PromptOnlyDemanded
    NeverPrompted
PROPERTIES
    EventuallyQuiescent
    AllRootsDone
