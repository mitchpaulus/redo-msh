\* THE GAP-CLOSURE CHECK. Two concurrent traversals enter the cycle a <-> b
\* from different sides -- exactly the scenario that DEADLOCKS under
\* today's chain-based detection (CycleLock_CycleParallel). With the
\* waits-for graph, every interleaving must instead end in a clean cycle
\* error on both targets (BuildsCanFail = FALSE makes cycle detection the
\* only possible failure source, so CycleErrorsOut is sharp).
SPECIFICATION Spec
CONSTANTS
    J = 2
    BuildsCanFail = FALSE
CONSTANT Targets <- CycleTargets
CONSTANT DepsOf <- CycleDeps
CONSTANT Roots <- RootsAB
INVARIANTS TypeOK BuildOnce TokenBound DepsSettledFirst
PROPERTIES EventuallyQuiescent CycleErrorsOut
