\* An aborted speculative instance that was only WAITING on a lock must not
\* take the lock holder's demand edges with it (DropInstance). With the
\* former DropWaitsBoth this deadlocks (insert-once demands, as in
\* build_parallel) and violates DemandEdgesPresent in 15 steps.
SPECIFICATION Spec
CONSTANTS
    Targets <- EvTargets
    Recorded <- EvRecorded
    Actual <- EvActual
    Roots <- RootsAS
    Cleanable <- CleanC
    BuildsCanFail = FALSE
    HandEdited <- NoTargets
    PromptAnswers <- Yes
INVARIANTS
    TypeOK
    NoFailure
    ActualDepsFirst
    CommitOnce
    LockConsistent
    DemandEdgesPresent
    VerifiedSoundly
PROPERTIES
    EventuallyQuiescent
    AllRootsDone
