\* The merged condition with the staleness two levels below the re-checked
\* target (T <- D <- E <- es): a direct dep settled in this session vouches
\* for its whole subtree.
SPECIFICATION Spec
CONSTANT Targets <- ChainTargets
CONSTANT Sources <- ChainSources
CONSTANT DepsOf <- ChainDeps
CONSTANT Sessions <- TwoSessions
CONSTANT Root = "T"
CONSTANT MaxEdits = 2
CONSTANT Recheck = "settled"
CONSTANT SpawnFirst = TRUE
INVARIANTS TypeOK NoStaleRun
PROPERTIES Termination
