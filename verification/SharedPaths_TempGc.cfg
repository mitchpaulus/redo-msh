\* KNOWN GAP, EXPECTED VIOLATION of NoLostOutput: a second run's startup
\* gc_temps deletes a live build's stdout capture; that build then commits
\* its target as "no output" and deletes it. Reproduced against the binary.
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = FALSE
    SessionScopedLogs = FALSE
    GcAtomic = FALSE
    InodeCheck = FALSE
    JanitorDeletes = TRUE
    MaxCrashes = 2
CONSTANT Sessions <- TwoSessions
CONSTANT Builders <- TwoSessions
INVARIANTS NoLostOutput
