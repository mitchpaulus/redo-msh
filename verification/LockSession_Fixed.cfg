\* THE FIXED PROTOCOL: two sessions, three processes (one forced), coarse
\* timestamps, a source edit, crashes anywhere: every property holds.
SPECIFICATION Spec
CONSTANTS
    MaxSrcEdits = 1
    CoarseTicks = TRUE
    MaxTicks = 1
    ExactDoFile = TRUE
    Phony = FALSE
    Always = FALSE
    RecheckOod = TRUE
    HashBeforeRename = TRUE
    RacyGitRule = TRUE
CONSTANT Procs <- ThreeProcs
CONSTANT SessionOf <- TwoSessions3
CONSTANT Forced <- P3Forced
INVARIANTS TypeOK Mutex LockHeld MarkerDiscipline NoRedundantBuild NoFalseRefusal NoOwnOutputAsSource DiskDbAgree UpToDateIsTrue
PROPERTIES Termination
