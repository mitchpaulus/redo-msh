\* Stale database: recorded says a -> {b,c}, the do-file declares {c,d}.
\* Exercises a dropped dep (b: speculatively ensured, wasted but harmless),
\* a kept dep (c), and a mid-build discovered dep (d). All clean/dirty
\* combinations, do-file failures on.
SPECIFICATION Spec
CONSTANTS
    J = 2
    BuildsCanFail = TRUE
CONSTANT Targets <- StaleTargets
CONSTANT Recorded <- StaleRecorded
CONSTANT Actual <- StaleActual
CONSTANT Roots <- RootsA
CONSTANT Cleanable <- StaleTargets
INVARIANTS TypeOK BuildOnce TokenBound ActualDepsFirst VerifiedSoundly
PROPERTIES EventuallyQuiescent Settles
