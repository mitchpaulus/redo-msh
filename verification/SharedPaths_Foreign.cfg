\* KNOWN GAP, EXPECTED VIOLATION of FollowsOwnBuild: a lagging follower
\* opens the shared log path after another run replaced it and tails THAT
\* run's live build; its own run cannot exit until that build ends.
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = TRUE
    SessionScopedLogs = FALSE
    GcAtomic = FALSE
    InodeCheck = FALSE
    JanitorDeletes = TRUE
    MaxCrashes = 2
CONSTANT Sessions <- TwoSessions
CONSTANT Builders <- TwoSessions
INVARIANTS FollowsOwnBuild
