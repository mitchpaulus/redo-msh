\* Coverage check, EXPECTED VIOLATION of NeverVerifiedOverRebuild: on the
\* diamond, a dep rebuilt with identical content lets its parent verify
\* (content-hash pruning), so the model genuinely distinguishes "rebuilt"
\* from "changed" and VerifiedSoundly's dep clause is not vacuous.
SPECIFICATION Spec
CONSTANTS
    J = 2
    BuildsCanFail = FALSE
CONSTANT Targets <- DiamondTargets
CONSTANT Recorded <- DiamondDeps
CONSTANT Actual <- DiamondDeps
CONSTANT Roots <- RootsA
CONSTANT Cleanable <- DiamondTargets
INVARIANTS NeverVerifiedOverRebuild
