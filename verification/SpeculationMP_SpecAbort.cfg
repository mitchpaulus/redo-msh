\* Forces the mid-build speculation abort: u's checker (inside t's child
\* process) speculatively builds s on a stale recorded edge; s's do-file
\* really demands t, which is mid-build above it. The demand's cycle rides
\* s's creation edge, so s's speculative build aborts (sfail, quarantined)
\* and t commits — no failure anywhere, no deadlock. This is the shape
\* that, in the shipping branch, either deadlocks (no chain hit) or
\* fabricates "dependency cycle detected: X -> g -> X" (the reproduced
\* spurious-failure bug).
SPECIFICATION Spec
CONSTANTS
    Targets <- AbortTargets
    Recorded <- AbortRecorded
    Actual <- AbortActual
    Roots <- RootsT
    Cleanable <- NoTargets
    BuildsCanFail = FALSE
INVARIANTS
    TypeOK
    NoFailure
    ActualDepsFirst
    CommitOnce
    LockConsistent
PROPERTIES
    EventuallyQuiescent
    AllRootsDone
