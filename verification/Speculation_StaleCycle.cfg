\* THE SELF-HEALING CHECK. The database records a cycle a <-> b, but the
\* do-files have been fixed (no actual deps). Speculative cycle detection
\* is SOFT: it must abandon speculation and rebuild, not error. With
\* builds unable to fail, EVERY interleaving must end all-done, none
\* failed (AllDone) -- stale edges waste work but never invent an error.
\* Both targets start as roots (two concurrent demands).
SPECIFICATION Spec
CONSTANTS
    J = 2
    BuildsCanFail = FALSE
CONSTANT Targets <- TwoTargets
CONSTANT Recorded <- CycleEdges
CONSTANT Actual <- NoEdges2
CONSTANT Roots <- RootsAB
CONSTANT Cleanable <- TwoTargets
INVARIANTS TypeOK BuildOnce TokenBound ActualDepsFirst VerifiedSoundly
PROPERTIES EventuallyQuiescent AllDone
