\* The database records a cycle (a <-> b) that the do-files no longer
\* have: speculation over the stale recorded edges must self-heal on every
\* interleaving -- no failure, both roots done.
SPECIFICATION Spec
CONSTANTS
    Targets <- TwoTargets
    Recorded <- CycleActual
    Actual <- NoRecorded2
    Roots <- RootsAB
    Cleanable <- TwoTargets
    BuildsCanFail = FALSE
    HandEdited <- NoTargets
    PromptAnswers <- Yes
INVARIANTS
    TypeOK
    NoFailure
    ActualDepsFirst
    CommitOnce
    LockConsistent
    DemandEdgesPresent
    VerifiedSoundly
    PromptOnlyDemanded
PROPERTIES
    EventuallyQuiescent
    AllRootsDone
