\* Coverage check, EXPECTED VIOLATION of NeverFails: in LiveCross the two
\* live sessions really do reach the mutual wait on each other's locks and
\* report it, so LiveCross's passing properties are not vacuous.
SPECIFICATION Spec
CONSTANTS
    MaxCrashes = 0
    GcByLiveness = TRUE
CONSTANT Sessions <- TwoSessions
CONSTANT Targets <- AB
CONSTANT DepsOf <- ChangedGraphs
CONSTANT RootsOf <- RootsAB2
INVARIANTS NeverFails
