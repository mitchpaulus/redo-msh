\* The code (src/build.rs prompt_overwrite, since 2026-09-03): a prompting
\* job keeps its token while the human thinks. Eager scheduler (what
\* src/parallel.rs implements), prompts at every depth (nested processes
\* prompt too), and jobs that need a prompter's target block on its kernel
\* lock holding their tokens. Depth 3, J=2.
SPECIFICATION Spec
CONSTANTS
    J = 2
    Lazy = FALSE
    Prompts = TRUE
    PromptMode = "hold"
    LockWaits = TRUE
CONSTANT FanOut <- Tree122
INVARIANTS TypeOK TokenConservation OwnConsistent OwnUnique TokenHeld ChildrenOnlyWhileWaiting Bound ExactBound SemaphoreMax WorkConserving
PROPERTIES Termination
