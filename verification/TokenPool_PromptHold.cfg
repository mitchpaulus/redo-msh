\* Fix 1 for PromptDeadlock: a prompting job keeps its token (costs one
\* slot per open question; the prompt lock allows one at a time). Depth 3.
SPECIFICATION Spec
CONSTANTS
    J = 2
    Lazy = TRUE
    Prompts = TRUE
    PromptMode = "hold"
CONSTANT FanOut <- Tree122
INVARIANTS TypeOK TokenConservation OwnConsistent OwnUnique TokenHeld ChildrenOnlyWhileWaiting Bound ExactBound SemaphoreMax
PROPERTIES Termination
