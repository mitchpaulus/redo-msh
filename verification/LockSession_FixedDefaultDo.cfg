\* The fixed protocol when only a default*.do matches (the static-file rule
\* is live): a crash in any window never turns redo's output into a source.
SPECIFICATION Spec
CONSTANTS
    MaxSrcEdits = 1
    CoarseTicks = FALSE
    MaxTicks = 0
    ExactDoFile = FALSE
    Phony = FALSE
    Always = FALSE
    RecheckOod = TRUE
    HashBeforeRename = TRUE
    RacyGitRule = TRUE
CONSTANT Procs <- TwoProcs
CONSTANT SessionOf <- TwoSessions2
CONSTANT Forced <- NoneForced
INVARIANTS TypeOK Mutex LockHeld MarkerDiscipline NoRedundantBuild NoFalseRefusal NoOwnOutputAsSource DiskDbAgree UpToDateIsTrue
PROPERTIES Termination
