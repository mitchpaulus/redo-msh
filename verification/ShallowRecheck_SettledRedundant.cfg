\* THE COST, EXPECTED VIOLATION of NoRedundantBuild: the merged condition can
\* rebuild a target another run just brought up to date, when this run's
\* own task for the dep has not settled yet as the lock frees, or when a
\* concurrent run's mark_verified has since overwritten the dep's runid
\* (one column per file). Always in the safe direction.
SPECIFICATION Spec
CONSTANT Targets <- PairTargets
CONSTANT Sources <- PairSources
CONSTANT DepsOf <- PairDeps
CONSTANT Sessions <- TwoSessions
CONSTANT Root = "T"
CONSTANT MaxEdits = 2
CONSTANT Recheck = "settled"
CONSTANT SpawnFirst = TRUE
INVARIANTS NoRedundantBuild
