\* The merged code with THREE concurrent runs (two edits): 52,602,234
\* distinct states, about 10 minutes, so run.sh runs it only with
\* REDO_TLC_LONG=1. Invariants only (liveness over this many states is
\* slow; ShallowRecheck_Settled checks Termination).
SPECIFICATION Spec
CONSTANT Targets <- PairTargets
CONSTANT Sources <- PairSources
CONSTANT DepsOf <- PairDeps
CONSTANT Sessions <- ThreeSessions
CONSTANT Root = "T"
CONSTANT MaxEdits = 2
CONSTANT Recheck = "settled"
CONSTANT SpawnFirst = TRUE
INVARIANTS TypeOK NoStaleRun
