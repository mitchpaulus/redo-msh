\* The merged code with THREE concurrent runs (two edits), any checker
\* order: 57,723,666 distinct states, 10-15 minutes, so run.sh runs it
\* only with REDO_TLC_LONG=1. Invariants only (liveness over this many states is
\* slow; ShallowRecheck_Settled checks Termination).
SPECIFICATION Spec
CONSTANT Targets <- PairTargets
CONSTANT Sources <- PairSources
CONSTANT DepsOf <- PairDeps
CONSTANT Sessions <- ThreeSessions
CONSTANT Root = "T"
CONSTANT MaxEdits = 2
CONSTANT Recheck = "settled"
CONSTANT SpawnFirst = FALSE
INVARIANTS TypeOK NoStaleRun
