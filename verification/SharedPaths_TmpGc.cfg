\* KNOWN GAP, EXPECTED VIOLATION of NoGcFailedBuild: gc_logs deletes every
\* *.tmp, including a live build's log temp between create and rename;
\* create_log's rename then fails and the build errors out.
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = FALSE
    SessionScopedLogs = FALSE
    GcAtomic = FALSE
    InodeCheck = FALSE
    JanitorDeletes = TRUE
    MaxCrashes = 2
CONSTANT Sessions <- TwoSessions
CONSTANT Builders <- TwoSessions
INVARIANTS NoGcFailedBuild
