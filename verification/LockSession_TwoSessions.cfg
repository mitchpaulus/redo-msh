\* KNOWN GAP, EXPECTED VIOLATION of NoRedundantBuild: two concurrent
\* top-level redo runs both decide "out of date" before locking; the second,
\* on getting the lock, compares runid to its own session only and rebuilds
\* what the first just built. Reproduced against the binary.
SPECIFICATION Spec
CONSTANTS
    MaxSrcEdits = 0
    CoarseTicks = FALSE
    MaxTicks = 0
    ExactDoFile = TRUE
    Phony = FALSE
    Always = FALSE
    RecheckOod = FALSE
    HashBeforeRename = FALSE
    RacyGitRule = FALSE
CONSTANT Procs <- TwoProcs
CONSTANT SessionOf <- TwoSessions2
CONSTANT Forced <- NoneForced
INVARIANTS NoRedundantBuild
