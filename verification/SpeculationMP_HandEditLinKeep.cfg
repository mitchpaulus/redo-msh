\* Same, but a still needs b: the speculative lineage is upgraded to
\* demanded either before x's guard runs (x prompts in place) or after the
\* abort (b is reclaimed, re-run demanded, and x prompts then). Either way
\* the question is asked on a demanded lineage and, answered yes, a is done.
SPECIFICATION Spec
CONSTANTS
    Targets <- LinTargets
    Recorded <- LinRecorded
    Actual <- LinKeepActual
    Roots <- RootsA
    Cleanable <- NoTargets
    BuildsCanFail = FALSE
    HandEdited <- HandX
    PromptAnswers <- Yes
INVARIANTS
    TypeOK
    NoFailure
    ActualDepsFirst
    CommitOnce
