\* KNOWN GAP, EXPECTED VIOLATION of NoLostEvent, with every other file rule
\* fixed: a GC deletes another run's run.<s>.lock between its creation and
\* its lock; that run locks an unlinked file, a third run's GC then finds no
\* lock file, judges the run dead and deletes its live run trace. Every
\* later event is lost -- including the run's own `done`, so its follower
\* waits forever and the run never exits (a hang).
\* (Two builders plus a third run that only sweeps; symmetry over builders.)
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = TRUE
    SessionScopedLogs = TRUE
    GcAtomic = FALSE
    InodeCheck = FALSE
    JanitorDeletes = TRUE
    MaxCrashes = 1
CONSTANT Sessions = {s1, s2, s3}
CONSTANT Builders = {s1, s2}
SYMMETRY Perms
INVARIANTS NoLostEvent
