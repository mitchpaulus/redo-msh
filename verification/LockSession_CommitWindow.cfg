\* KNOWN GAP, EXPECTED VIOLATION of NoFalseRefusal: today's commit is a
\* rename followed by a separate transaction. A crash (or failed commit)
\* between them leaves redo's own new output on disk with the OLD hash
\* recorded; every later build refuses it as "modified outside redo".
\* Reproduced against the binary (kill -9 in that window).
SPECIFICATION Spec
CONSTANTS
    MaxSrcEdits = 0
    CoarseTicks = FALSE
    MaxTicks = 0
    ExactDoFile = TRUE
    Phony = FALSE
    Always = FALSE
    RecheckOod = FALSE
    HashBeforeRename = FALSE
    RacyGitRule = FALSE
CONSTANT Procs <- TwoProcs
CONSTANT SessionOf <- OneSession2
CONSTANT Forced <- NoneForced
INVARIANTS NoFalseRefusal
