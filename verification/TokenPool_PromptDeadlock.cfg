\* KNOWN GAP, EXPECTED DEADLOCK, with today's lazy scheduler: today's
\* prompt_overwrite releases a token to the pool while waiting for the human
\* and spins on POOL try-acquire to resume. Two answered prompts can leave
\* the second spinning forever: the only pool token is held by a blocked
\* ancestor waiting for it, and its own process's own token sits free.
\* All safety invariants hold up to the deadlock.
SPECIFICATION Spec
CONSTANTS
    J = 2
    Lazy = TRUE
    Prompts = TRUE
    PromptMode = "pool"
CONSTANT FanOut <- Tree22
INVARIANTS TypeOK TokenConservation OwnConsistent OwnUnique TokenHeld ChildrenOnlyWhileWaiting Bound ExactBound SemaphoreMax
PROPERTIES Termination
