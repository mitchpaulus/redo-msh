\* A dependency edge reversed between runs: recorded says a needs b, the
\* do-files now say b needs a. The real graph is acyclic, so nothing may
\* fail and everything must settle — the property the OLD design breaks
\* (Speculation_Reversed.cfg shows its BWait hard-failing b through a's
\* speculative edge).
SPECIFICATION Spec
CONSTANTS
    Targets <- TwoTargets
    Recorded <- RevRecorded
    Actual <- RevActual
    Roots <- RootsAB
    Cleanable <- TwoTargets
    BuildsCanFail = FALSE
INVARIANTS
    TypeOK
    NoFailure
    ActualDepsFirst
    CommitOnce
    LockConsistent
PROPERTIES
    EventuallyQuiescent
    AllRootsDone
