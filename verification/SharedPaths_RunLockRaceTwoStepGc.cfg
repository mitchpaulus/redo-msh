\* EXPECTED VIOLATION of NoLostEvent: the inode re-check alone is not
\* enough. Today's GC probes liveness and deletes by path LATER; a run can
\* create, lock and verify its run.<s>.lock after the probe and still have
\* it unlinked by the delete. GcAtomic is required too.
\* (Two builders plus a third run that only sweeps; symmetry over builders.)
SPECIFICATION Spec
CONSTANTS
    GcByLiveness = TRUE
    SessionScopedLogs = TRUE
    GcAtomic = FALSE
    InodeCheck = TRUE
    JanitorDeletes = TRUE
    MaxCrashes = 1
CONSTANT Sessions = {s1, s2, s3}
CONSTANT Builders = {s1, s2}
SYMMETRY Perms
INVARIANTS NoLostEvent
