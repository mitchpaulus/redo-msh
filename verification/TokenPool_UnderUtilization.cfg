\* KNOWN GAP, EXPECTED VIOLATION of WorkConserving: today's run_parallel
\* sleeps in rx.recv() when the pool is empty and retries only when one of
\* ITS OWN jobs completes, so a token freed elsewhere in the tree can sit
\* idle while this process has a launchable job. Not a safety or liveness
\* bug (D2J*/D3J* pass Termination with this scheduler); a throughput one.
SPECIFICATION Spec
CONSTANTS
    J = 3
    Lazy = TRUE
    Prompts = FALSE
    PromptMode = "pool"
CONSTANT FanOut <- Tree32
INVARIANTS WorkConserving
