\* The shipping prompt_overwrite: release the token to the pool while the
\* human thinks, then spin on the pool to get one back, with the target
\* lock held throughout. Predicted DEADLOCK: the released token (and every
\* other one) ends up held by jobs blocked on the prompter's lock, and the
\* prompter's spin never observes a free token. run.sh expects "deadlock".
SPECIFICATION Spec
CONSTANTS
    J = 2
    NTop = 2
    NSub = 2
    PromptMode = "release"
INVARIANTS TypeOK TokenConservation Bound
PROPERTIES Termination
